
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>JARVIS AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #211900 0%, #090909 42%, #000 100%);
  color: #f5d477;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 22px 10px 8px;
}

header h1 {
  margin: 0;
  font-size: 32px;
  letter-spacing: 8px;
  text-shadow: 0 0 18px #d49b20;
}

#status {
  color: #b99a50;
  font-size: 11px;
  letter-spacing: 3px;
  margin-top: 9px;
}

.reactor-wrap {
  display: flex;
  justify-content: center;
  padding: 24px 0;
}

.reactor {
  width: 125px;
  height: 125px;
  border: 3px solid #d6a52e;
  border-radius: 50%;
  display: grid;
  place-items: center;
  position: relative;
  box-shadow: 0 0 20px #b78319, inset 0 0 20px #9b741e;
  animation: pulse 3s infinite ease-in-out;
}

.reactor::before,
.reactor::after {
  content: "";
  position: absolute;
  border: 2px solid #e8bd54;
  border-radius: 50%;
}

.reactor::before {
  width: 90px;
  height: 90px;
  border-left-color: transparent;
  border-right-color: transparent;
  animation: spin 5s linear infinite;
}

.reactor::after {
  width: 65px;
  height: 65px;
  border-top-color: transparent;
  border-bottom-color: transparent;
  animation: spin 3s linear infinite reverse;
}

.core {
  width: 35px;
  height: 35px;
  background: #ffe6a0;
  border-radius: 50%;
  box-shadow: 0 0 25px #ffc52e, 0 0 50px #ffc52e;
}

body.listening .reactor {
  animation: pulse 0.8s infinite;
}

body.thinking .reactor::before {
  animation-duration: 0.8s;
}

body.speaking .core {
  animation: pulse 0.5s infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.85; }
  50% { transform: scale(1.06); opacity: 1; }
}

.info {
  display: flex;
  justify-content: center;
  gap: 9px;
  padding: 0 12px 18px;
}

.info div {
  border: 1px solid #76591e;
  background: #100e08;
  border-radius: 10px;
  padding: 10px 8px;
  flex: 1;
  max-width: 120px;
  text-align: center;
  font-size: 10px;
  color: #d7bd7a;
}

.info strong {
  display: block;
  color: #f5d477;
  margin-bottom: 5px;
  font-size: 11px;
}

main {
  width: min(700px, 94%);
  margin: auto;
  padding-bottom: 25px;
}

.chat {
  height: 38vh;
  min-height: 230px;
  max-height: 430px;
  overflow-y: auto;
  padding: 14px;
  border: 1px solid #73551b;
  border-radius: 14px;
  background: rgba(8, 8, 8, 0.88);
  box-shadow: 0 0 18px #6c4c1522;
}

.message {
  margin: 10px 0;
  padding: 12px 14px;
  border-radius: 12px;
  line-height: 1.55;
  font-size: 14px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.user {
  background: #30240c;
  color: #ffe5a0;
  margin-left: 12%;
  border: 1px solid #85651e;
}

.jarvis {
  background: #111;
  color: #eee1bd;
  margin-right: 8%;
  border: 1px solid #51401c;
}

.message-label {
  display: block;
  color: #d9ad45;
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

input {
  min-width: 0;
  flex: 1;
  background: #101010;
  border: 1px solid #8a6825;
  border-radius: 10px;
  padding: 14px;
  color: white;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #f2c65d;
  box-shadow: 0 0 10px #d39b2833;
}

button {
  background: linear-gradient(135deg, #d7a52e, #795311);
  color: #100d05;
  border: none;
  border-radius: 10px;
  padding: 12px 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

.extra {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.extra button {
  flex: 1;
  background: #17130a;
  color: #e8c66d;
  border: 1px solid #76591e;
  font-size: 12px;
}

.hint {
  color: #8d7a4e;
  text-align: center;
  font-size: 11px;
  margin-top: 12px;
}

a {
  color: #f2c65d;
}
</style>
</head>

<body>

<header>
  <h1>J.A.R.V.I.S.</h1>
  <div id="status">SYSTEM ONLINE</div>
</header>

<div class="reactor-wrap">
  <div class="reactor">
    <div class="core"></div>
  </div>
</div>

<div class="info">
  <div>
    <strong>SYSTEM</strong>
    ONLINE
  </div>
  <div>
    <strong>MEMORY</strong>
    ACTIVE
  </div>
  <div>
    <strong>NETWORK</strong>
    READY
  </div>
</div>

<main>
  <div class="chat" id="chat"></div>

  <div class="controls">
    <input
      id="message"
      type="text"
      placeholder="Sprich mit JARVIS..."
      autocomplete="off"
    >
    <button id="sendButton" onclick="sendMessage()">SENDEN</button>
  </div>

  <div class="extra">
    <button onclick="startListening()">🎤 SPRECHEN</button>
    <button onclick="toggleVoice()" id="voiceButton">🔊 STIMME AN</button>
    <button onclick="stopSpeaking()">⏹ STOP</button>
    <button onclick="clearMemory()">🗑 LÖSCHEN</button>
  </div>

  <div class="hint">
    JARVIS AI · PERSONAL ASSISTANT
  </div>
</main>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const statusText = document.getElementById("status");
const sendButton = document.getElementById("sendButton");

const MEMORY_KEY = "jarvis_conversation_v1";

let history = [];
let voiceEnabled = true;
let recognition = null;
let isBusy = false;

try {
  history = JSON.parse(localStorage.getItem(MEMORY_KEY) || "[]");
  if (!Array.isArray(history)) history = [];
} catch {
  history = [];
}

// Text für die Anzeige und die Stimme bereinigen
function cleanText(text) {
  return String(text)
    .replace(/```[\s\S]*?```/g, " Code wurde ausgelassen. ")
    .replace(/`([^`]*)`/g, "$1")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
    .replace(/https?:\/\/\S+/g, " Link in der Antwort. ")
    .replace(/^#{1,6}\s*/gm, "")
    .replace(/(\*\*|__)(.*?)\1/g, "$2")
    .replace(/[*_~]/g, "")
    .replace(/^\s*[-•]\s*/gm, "")
    .replace(/^\s*\d+\.\s*/gm, "")
    .replace(/[>#|]/g, " ")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

function setStatus(status, className = "") {
  statusText.textContent = status;
  document.body.classList.remove(
    "listening", "thinking", "speaking"
  );

  if (className) {
    document.body.classList.add(className);
  }
}

function addMessage(role, text) {
  const message = document.createElement("div");
  message.className = "message " + role;

  const label = document.createElement("span");
  label.className = "message-label";
  label.textContent = role === "user" ? "DU" : "JARVIS";

  const content = document.createElement("div");
  content.textContent = cleanText(text);

  message.appendChild(label);
  message.appendChild(content);

  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
}

function saveMemory() {
  history = history.slice(-12);

  try {
    localStorage.setItem(MEMORY_KEY, JSON.stringify(history));
  } catch (error) {
    console.error("Speichern fehlgeschlagen:", error);
  }
}

function loadMemory() {
  chat.innerHTML = "";

  if (history.length === 0) {
    addMessage(
      "jarvis",
      "Guten Abend. JARVIS ist online. Wie kann ich Ihnen helfen?"
    );
    return;
  }

  history.forEach(item => {
    addMessage(
      item.role === "user" ? "user" : "jarvis",
      item.parts?.[0]?.text || item.text || ""
    );
  });
}

function getGermanVoice() {
  const voices = speechSynthesis.getVoices();

  const germanVoices = voices.filter(voice =>
    voice.lang.toLowerCase().startsWith("de")
  );

  return (
    germanVoices.find(voice =>
      /google|microsoft|natural/i.test(voice.name)
    ) ||
    germanVoices[0] ||
    null
  );
}

function speak(text) {
  if (!voiceEnabled || !("speechSynthesis" in window)) return;

  const clean = cleanText(text);
  if (!clean) return;

  speechSynthesis.cancel();

  // Lange Antworten in kleinere Abschnitte teilen
  const sentences = clean.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [clean];

  const voice = getGermanVoice();

  sentences.forEach(sentence => {
    const part = sentence.trim();
    if (!part) return;

    const utterance = new SpeechSynthesisUtterance(part);

    utterance.lang = "de-DE";
    utterance.voice = voice;
    utterance.rate = 0.95;
    utterance.pitch = 0.98;
    utterance.volume = 1;

    utterance.onstart = () => setStatus("JARVIS SPRICHT", "speaking");

    utterance.onend = () => {
      if (!speechSynthesis.speaking) {
        setStatus("SYSTEM ONLINE");
      }
    };

    utterance.onerror = () => setStatus("SYSTEM ONLINE");

    speechSynthesis.speak(utterance);
  });
}

function stopSpeaking() {
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  setStatus("SYSTEM ONLINE");
}

function toggleVoice() {
  voiceEnabled = !voiceEnabled;

  document.getElementById("voiceButton").textContent =
    voiceEnabled ? "🔊 STIMME AN" : "🔇 STIMME AUS";

  if (!voiceEnabled) stopSpeaking();
}

async function sendMessage() {
  const message = input.value.trim();

  if (!message || isBusy) return;

  isBusy = true;
  sendButton.disabled = true;
  input.value = "";

  stopSpeaking();

  addMessage("user", message);

  const previousHistory = history.slice(-12);

  history.push({
    role: "user",
    parts: [{ text: message }]
  });

  saveMemory();
  setStatus("JARVIS DENKT", "thinking");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: message,
        history: previousHistory
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Verbindung fehlgeschlagen.");
    }

    const reply = data.reply || data.text;

    if (!reply || typeof reply !== "string") {
      throw new Error("JARVIS hat keine lesbare Antwort geliefert.");
    }

    addMessage("jarvis", reply);

    history.push({
      role: "model",
      parts: [{ text: reply }]
    });

    saveMemory();

    speak(reply);

    if (!voiceEnabled) {
      setStatus("SYSTEM ONLINE");
    }

  } catch (error) {
    console.error(error);

    addMessage(
      "jarvis",
      "Entschuldigung, ich kann gerade keine Verbindung zu meinem KI-System herstellen. Bitte versuche es erneut."
    );

    setStatus("CONNECTION ERROR");
  } finally {
    isBusy = false;
    sendButton.disabled = false;
    input.focus();
  }
}

function clearMemory() {
  if (!confirm("Möchtest du den gespeicherten Gesprächsverlauf löschen?")) {
    return;
  }

  history = [];
  localStorage.removeItem(MEMORY_KEY);
  stopSpeaking();
  loadMemory();
  setStatus("MEMORY CLEARED");
}

function startListening() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    addMessage(
      "jarvis",
      "Die Spracheingabe wird von diesem Browser leider nicht unterstützt."
    );
    return;
  }

  if (recognition) {
    recognition.stop();
  }

  recognition = new SpeechRecognition();
  recognition.lang = "de-DE";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    setStatus("ICH HÖRE ZU", "listening");
  };

  recognition.onresult = event => {
    const spokenText = event.results[0][0].transcript;
    input.value = spokenText;
    sendMessage();
  };

  recognition.onerror = () => {
    setStatus("SPRACHFEHLER");
  };

  recognition.onend = () => {
    if (!isBusy) setStatus("SYSTEM ONLINE");
  };

  recognition.start();
}

input.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    sendMessage();
  }
});

if ("speechSynthesis" in window) {
  speechSynthesis.onvoiceschanged = () => {
    getGermanVoice();
  };
}

loadMemory();
</script>

</body>
</html>
