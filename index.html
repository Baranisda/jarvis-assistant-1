
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080807;color:#f5e5b0;
 font-family:Arial,sans-serif;min-height:100vh;
 display:flex;flex-direction:column;align-items:center;
}
header{width:100%;padding:22px;text-align:center;
 letter-spacing:6px;border-bottom:1px solid #735b25}
header small{display:block;color:#a78b45;
 letter-spacing:3px;margin-top:8px}
main{width:min(650px,94%);display:flex;
 flex-direction:column;align-items:center;padding:25px 0}
#status{font-size:11px;letter-spacing:3px;color:#c5a34c}
.reactor{
 width:210px;height:210px;border-radius:50%;
 border:2px solid #b99335;margin:30px;
 display:grid;place-items:center;
 box-shadow:0 0 20px #a77c20, inset 0 0 25px #8b641c;
 animation:pulse 3s infinite;
}
.core{width:125px;height:125px;border-radius:50%;
 border:5px solid #e8c35d;
 background:radial-gradient(circle,#fff4bd,#c39426 45%,#201605 75%);
 box-shadow:0 0 35px #e6b83c}
@keyframes pulse{50%{box-shadow:0 0 40px #d5a333,inset 0 0 35px #b58b2e}}
#messages{
 width:100%;height:330px;overflow-y:auto;
 border:1px solid #59451d;border-radius:15px;
 padding:15px;background:#11100c;
}
.msg{padding:12px 14px;margin:9px 0;
 border-radius:12px;line-height:1.5;overflow-wrap:anywhere}
.user{background:#493716;color:#fff0c0;margin-left:35px}
.assistant{background:#242017;color:#f5e5b0;margin-right:35px}
.controls{display:flex;width:100%;gap:8px;margin-top:14px}
input{
 flex:1;min-width:0;background:#17150f;color:white;
 border:1px solid #92712e;border-radius:12px;padding:15px;
}
button{background:#c39a3c;color:#171006;border:0;
 border-radius:12px;padding:13px 17px;font-weight:bold}
button:active{opacity:.7}
#voice{margin-top:12px;background:#292114;color:#f2d47e}
footer{padding:20px;color:#76643c;font-size:11px}
</style>
</head>
<body>
<header>
 J.A.R.V.I.S.
 <small>JUST A RATHER VERY INTELLIGENT SYSTEM</small>
</header>
<main>
 <div id="status">SYSTEM INITIALISIERT</div>
 <div class="reactor"><div class="core"></div></div>
 <div id="messages">
  <div class="msg assistant">Guten Tag, Baran. Ich bin JARVIS. Mein System ist bereit. Wie kann ich helfen?</div>
 </div>
 <div class="controls">
  <input id="input" placeholder="Nachricht an JARVIS..." autocomplete="off">
  <button id="send">SENDEN</button>
 </div>
 <button id="mic" style="margin-top:10px">🎙 MIKROFON</button>
 <button id="voice">🔊 ANTWORT VORLESEN: AN</button>
</main>
<footer>JARVIS AI • PERSONAL ASSISTANT</footer>

<script>
const input=document.getElementById("input");
const messages=document.getElementById("messages");
const status=document.getElementById("status");
let voiceEnabled=true;
let recognition=null;

function setStatus(text){status.textContent=text}

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 messages.appendChild(div);
 messages.scrollTop=messages.scrollHeight;
 return div;
}

function speak(text){
 if(!voiceEnabled || !("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="de-DE";
 utterance.rate=0.92;
 utterance.pitch=0.75;
 speechSynthesis.speak(utterance);
}

async function sendMessage(){
 const text=input.value.trim();
 if(!text)return;
 addMessage(text,"user");
 input.value="";
 const waiting=addMessage("Ich denke nach...","assistant");
 setStatus("KI VERARBEITET ANFRAGE");

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:text})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"API Fehler");
  waiting.textContent=data.reply;
  speak(data.reply);
  setStatus("JARVIS ONLINE");
 }catch(error){
  console.error(error);
  waiting.textContent="Baran, ich kann mein KI-Gehirn gerade nicht erreichen. Bitte überprüfe die Verbindung.";
  setStatus("KI VERBINDUNG FEHLGESCHLAGEN");
 }
}

document.getElementById("send").addEventListener("click",sendMessage);
input.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

document.getElementById("voice").addEventListener("click",()=>{
 voiceEnabled=!voiceEnabled;
 document.getElementById("voice").textContent=
 voiceEnabled?"🔊 ANTWORT VORLESEN: AN":"🔇 ANTWORT VORLESEN: AUS";
 if(!voiceEnabled)speechSynthesis.cancel();
});

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){
 recognition=new SpeechRecognition();
 recognition.lang="de-DE";
 recognition.continuous=false;
 recognition.interimResults=false;
 recognition.onstart=()=>setStatus("ICH HÖRE ZU...");
 recognition.onresult=e=>{
  input.value=e.results[0][0].transcript;
  sendMessage();
 };
 recognition.onerror=()=>setStatus("MIKROFONFEHLER");
 recognition.onend=()=>setStatus("JARVIS BEREIT");
}
document.getElementById("mic").addEventListener("click",()=>{
 if(!recognition){
  setStatus("SPRACHERKENNUNG NICHT VERFÜGBAR");
  return;
 }
 recognition.start();
});
</script>
</body>
</html>
