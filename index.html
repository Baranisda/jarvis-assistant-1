
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>JARVIS AI</title>

<style>
:root {
  --gold: #d6a83f;
  --bg: #080808;
  --panel: #111;
  --text: #f5f5f5;
  --muted: #999;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(circle at top, #29200c, #080808 45%);
  color: var(--text);
  font-family: Arial, sans-serif;
  min-height: 100vh;
}
body.blue {
  --gold: #35baff;
  background: radial-gradient(circle at top, #092437, #080808 48%);
}
header {
  padding: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #6c5425;
}
.logo {
  color: var(--gold);
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 5px;
}
button, input, select {
  font: inherit;
}
button {
  cursor: pointer;
}
.icon-btn {
  color: var(--gold);
  background: #171717;
  border: 1px solid #705722;
  border-radius: 10px;
  padding: 10px 13px;
}
main {
  width: min(850px, 94%);
  margin: 22px auto;
}
.panel {
  background: rgba(17,17,17,.94);
  border: 1px solid #59451f;
  border-radius: 15px;
  padding: 17px;
  margin-bottom: 17px;
  box-shadow: 0 0 22px #0008;
}
.reactor {
  width: 110px;
  height: 110px;
  border: 3px solid var(--gold);
  border-radius: 50%;
  margin: 10px auto 16px;
  display: grid;
  place-items: center;
  box-shadow: 0 0 18px var(--gold), inset 0 0 18px var(--gold);
  animation: pulse 3s infinite;
}
.reactor-inner {
  width: 65px;
  height: 65px;
  border: 3px solid var(--gold);
  border-radius: 50%;
  box-shadow: 0 0 20px var(--gold);
}
@keyframes pulse {
  50% { transform: scale(1.04); opacity: .75; }
}
.status {
  text-align: center;
  color: var(--gold);
  font-size: 13px;
  letter-spacing: 2px;
}
.dashboard {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.stat {
  background: #191919;
  padding: 13px;
  border-radius: 10px;
  border: 1px solid #333;
}
.stat small { color: var(--muted); }
.stat strong {
  display: block;
  color: var(--gold);
  margin-top: 7px;
  font-size: 19px;
}
h2 {
  color: var(--gold);
  font-size: 17px;
  letter-spacing: 1px;
}
#chat {
  height: 340px;
  overflow-y: auto;
  padding: 5px;
}
.message {
  padding: 12px;
  margin: 9px 0;
  border-radius: 11px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.user {
  background: #282111;
  border: 1px solid #6c5425;
  margin-left: 35px;
}
.jarvis {
  background: #171717;
  border: 1px solid #333;
  margin-right: 20px;
}
.input-row {
  display: flex;
  gap: 7px;
  margin-top: 10px;
}
#messageInput {
  flex: 1;
  min-width: 0;
  background: #080808;
  color: white;
  border: 1px solid #705722;
  border-radius: 10px;
  padding: 13px;
  outline: none;
}
.action {
  background: var(--gold);
  color: #080808;
  border: none;
  border-radius: 10px;
  padding: 12px 14px;
  font-weight: bold;
}
.action.secondary {
  background: #222;
  color: var(--gold);
  border: 1px solid #705722;
}
.action:disabled { opacity: .5; }
.task-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px;
  border-bottom: 1px solid #292929;
}
.task-row span { flex: 1; overflow-wrap: anywhere; }
.done { text-decoration: line-through; color: #777; }
#settings {
  display: none;
}
#settings.open { display: block; }
.setting {
  margin: 14px 0;
}
.setting label {
  display: block;
  color: var(--muted);
  margin-bottom: 7px;
}
.setting select, .setting input[type="range"] {
  width: 100%;
}
.setting select {
  background: #080808;
  color: white;
  border: 1px solid #705722;
  padding: 10px;
  border-radius: 8px;
}
input[type="range"] { accent-color: var(--gold); }
footer {
  text-align: center;
  color: #777;
  padding: 20px;
  font-size: 12px;
}
@media(max-width:500px) {
  .logo { font-size: 20px; }
  .input-row { flex-wrap: wrap; }
  #messageInput { flex-basis: 100%; }
  #chat { height: 310px; }
}
</style>
</head>

<body>
<header>
  <div class="logo">J.A.R.V.I.S.</div>
  <button class="icon-btn" id="settingsButton">⚙️</button>
</header>

<main>
  <section class="panel">
    <div class="reactor"><div class="reactor-inner"></div></div>
    <div class="status" id="status">SYSTEM ONLINE</div>
    <h2 style="text-align:center">SYSTEM DASHBOARD</h2>
    <div class="dashboard">
      <div class="stat"><small>UHRZEIT</small><strong id="clock">--:--:--</strong></div>
      <div class="stat"><small>DATUM</small><strong id="date">--</strong></div>
      <div class="stat"><small>AKKU</small><strong id="battery">Nicht verfügbar</strong></div>
      <div class="stat"><small>INTERNET</small><strong id="internet">Prüfe...</strong></div>
      <div class="stat"><small>OFFENE AUFGABEN</small><strong id="openTasks">0</strong></div>
      <div class="stat"><small>ERLEDIGTE AUFGABEN</small><strong id="doneTasks">0</strong></div>
    </div>
  </section>

  <section class="panel" id="settings">
    <h2>JARVIS CONTROL CENTER</h2>

    <div class="setting">
      <label for="voiceToggle">Sprachausgabe</label>
      <select id="voiceToggle">
        <option value="on">Aktiviert</option>
        <option value="off">Deaktiviert</option>
      </select>
    </div>

    <div class="setting">
      <label for="voiceSelect">Deutsche Stimme</label>
      <select id="voiceSelect">
        <option value="">Automatisch auswählen</option>
      </select>
    </div>

    <div class="setting">
      <label for="speed">Sprechgeschwindigkeit: <span id="speedValue">1.0</span></label>
      <input id="speed" type="range" min="0.75" max="1.25" step="0.05" value="1">
    </div>

    <div class="setting">
      <label for="answerStyle">Antwortstil</label>
      <select id="answerStyle">
        <option value="normal">Normal</option>
        <option value="short">Kurz</option>
        <option value="detailed">Ausführlich</option>
      </select>
    </div>

    <div class="setting">
      <label for="theme">Design</label>
      <select id="theme">
        <option value="gold">Gold</option>
        <option value="blue">Blau</option>
      </select>
    </div>

    <p id="memoryCount" style="color:#aaa"></p>
    <button class="action secondary" id="clearMemory">Chatverlauf löschen</button>
  </section>

  <section class="panel">
    <h2>JARVIS ASSISTANT</h2>
    <div id="chat"></div>

    <div class="input-row">
      <input id="messageInput" placeholder="Sprich mit JARVIS..." autocomplete="off">
      <button class="action" id="sendButton">Senden</button>
      <button class="action secondary" id="micButton">🎙️</button>
      <button class="action secondary" id="stopButton">⏹️</button>
    </div>
    <p style="color:#888;font-size:12px" id="voiceStatus">Sprachsteuerung bereit</p>
  </section>

  <section class="panel">
    <h2>AUFGABENMANAGER</h2>
    <div class="input-row">
      <input id="taskInput" placeholder="Neue Aufgabe...">
      <button class="action" id="addTask">Hinzufügen</button>
    </div>
    <div id="taskList"></div>
  </section>
</main>

<footer>J.A.R.V.I.S. AI SYSTEM · ONLINE</footer>

<script>
const $ = id => document.getElementById(id);

let history = load("jarvis_conversation_v1", []);
let tasks = load("jarvis_tasks_v1", []);
let settings = load("jarvis_settings_v1", {
  voice: "on",
  speed: 1,
  style: "normal",
  theme: "gold",
  voiceName: ""
});

let recognition = null;
let listening = false;
let busy = false;
let availableVoices = [];

function load(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value ?? fallback;
  } catch {
    return fallback;
  }
}

function save(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function setStatus(text) {
  $("status").textContent = text;
}

function cleanText(text) {
  return String(text || "")
    .replace(/```[\s\S]*?```/g, " Codeblock ausgelassen. ")
    .replace(/https?:\/\/\S+/g, " Link ")
    .replace(/!\[.*?\]\(.*?\)/g, "")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
    .replace(/#{1,6}\s*/g, "")
    .replace(/\*\*(.*?)\*\*/g, "$1")
    .replace(/\*(.*?)\*/g, "$1")
    .replace(/__(.*?)__/g, "$1")
    .replace(/_(.*?)_/g, "$1")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/^\s*[-*+]\s+/gm, "")
    .replace(/^\s*\d+\.\s+/gm, "")
    .replace(/[ \t]+/g, " ")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

function addMessage(role, text, shouldSpeak = false) {
  const div = document.createElement("div");
  div.className = "message " + role;
  div.textContent = text;
  $("chat").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;

  if (shouldSpeak) speak(text);
}

function updateMemoryCount() {
  $("memoryCount").textContent =
    "Gespeicherte Nachrichten: " + history.length;
}

function updateSettingsUI() {
  $("voiceToggle").value = settings.voice;
  $("speed").value = settings.speed;
  $("speedValue").textContent = Number(settings.speed).toFixed(2);
  $("answerStyle").value = settings.style;
  $("theme").value = settings.theme;
  document.body.classList.toggle("blue", settings.theme === "blue");
}

function saveSettings() {
  settings.voice = $("voiceToggle").value;
  settings.speed = Number($("speed").value);
  settings.style = $("answerStyle").value;
  settings.theme = $("theme").value;
  settings.voiceName = $("voiceSelect").value;
  save("jarvis_settings_v1", settings);
  updateSettingsUI();
}

function loadVoices() {
  if (!("speechSynthesis" in window)) return;

  availableVoices = speechSynthesis.getVoices();
  const germanVoices = availableVoices.filter(v =>
    v.lang && v.lang.toLowerCase().startsWith("de")
  );

  const select = $("voiceSelect");
  const previous = settings.voiceName;
  select.innerHTML = '<option value="">Automatisch auswählen</option>';

  germanVoices.forEach(voice => {
    const option = document.createElement("option");
    option.value = voice.name;
    option.textContent = voice.name + " (" + voice.lang + ")";
    select.appendChild(option);
  });

  if (germanVoices.some(v => v.name === previous)) {
    select.value = previous;
  } else {
    select.value = "";
  }
}

function chooseVoice() {
  if (!availableVoices.length) return null;

  if (settings.voiceName) {
    const chosen = availableVoices.find(v => v.name === settings.voiceName);
    if (chosen) return chosen;
  }

  return availableVoices.find(v =>
    v.lang && v.lang.toLowerCase() === "de-de"
  ) || availableVoices.find(v =>
    v.lang && v.lang.toLowerCase().startsWith("de")
  ) || null;
}

function stopSpeaking() {
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
  $("voiceStatus").textContent = listening
    ? "Mikrofon hört zu..."
    : "Sprachausgabe gestoppt";
}

function speak(text) {
  if (settings.voice !== "on" || !("speechSynthesis" in window)) return;

  stopSpeaking();

  const cleaned = cleanText(text);
  if (!cleaned) return;

  const utterance = new SpeechSynthesisUtterance(cleaned);
  utterance.lang = "de-DE";
  utterance.rate = Number(settings.speed) || 1;
  utterance.pitch = 1;
  utterance.volume = 1;

  const voice = chooseVoice();
  if (voice) utterance.voice = voice;

  utterance.onstart = () => {
    $("voiceStatus").textContent = "JARVIS spricht...";
  };
  utterance.onend = () => {
    $("voiceStatus").textContent = listening
      ? "Mikrofon hört zu..."
      : "Sprachausgabe bereit";
  };
  utterance.onerror = () => {
    $("voiceStatus").textContent = "Sprachausgabe nicht verfügbar";
  };

  speechSynthesis.speak(utterance);
}

if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

async function sendMessage() {
  const input = $("messageInput");
  const prompt = input.value.trim();

  if (!prompt || busy) return;

  input.value = "";
  stopSpeaking();

  const taskMatch = prompt.match(
    /^(?:jarvis[, ]*)?(?:erstelle eine aufgabe|neue aufgabe|merke dir als aufgabe)\s*:?\s*(.+)$/i
  );

  addMessage("user", prompt);
  history.push({ role: "user", content: prompt });
  history = history.slice(-12);
  save("jarvis_conversation_v1", history);
  updateMemoryCount();

  if (taskMatch) {
    tasks.push({
      text: taskMatch[1].trim(),
      done: false
    });
    save("jarvis_tasks_v1", tasks);
    renderTasks();
    const reply = "Aufgabe wurde gespeichert: " + taskMatch[1].trim();
    addMessage("jarvis", reply, true);
    history.push({ role: "assistant", content: reply });
    history = history.slice(-12);
    save("jarvis_conversation_v1", history);
    return;
  }

  busy = true;
  $("sendButton").disabled = true;
  setStatus("JARVIS DENKT...");

  let message = prompt;
  if (settings.style === "short") {
    message += "\nAntworte bitte kurz und direkt.";
  } else if (settings.style === "detailed") {
    message += "\nErkläre deine Antwort ausführlich und verständlich.";
  }

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message,
        history: history.slice(0, -1)
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Serverfehler " + response.status);
    }

    const reply = data.reply || "Ich habe leider keine Antwort erhalten.";
    addMessage("jarvis", reply, true);

    history.push({ role: "assistant", content: reply });
    history = history.slice(-12);
    save("jarvis_conversation_v1", history);
    updateMemoryCount();
    setStatus("SYSTEM ONLINE");
  } catch (error) {
    const errorText = "Verbindungsfehler: " + error.message;
    addMessage("jarvis", errorText, true);
    setStatus("VERBINDUNG PRÜFEN");
  } finally {
    busy = false;
    $("sendButton").disabled = false;
  }
}

function startListening() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    $("voiceStatus").textContent =
      "Spracherkennung wird von diesem Browser nicht unterstützt.";
    return;
  }

  if (listening && recognition) {
    recognition.stop();
    return;
  }

  stopSpeaking();

  recognition = new SpeechRecognition();
  recognition.lang = "de-DE";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    listening = true;
    $("micButton").textContent = "🔴";
    $("voiceStatus").textContent = "Ich höre zu...";
  };

  recognition.onresult = event => {
    const transcript = event.results[0][0].transcript;
    $("messageInput").value = transcript;
    sendMessage();
  };

  recognition.onerror = event => {
    $("voiceStatus").textContent =
      "Mikrofon: " + event.error;
  };

  recognition.onend = () => {
    listening = false;
    $("micButton").textContent = "🎙️";
    if (!busy) $("voiceStatus").textContent = "Sprachsteuerung bereit";
  };

  try {
    recognition.start();
  } catch {
    $("voiceStatus").textContent =
      "Mikrofon konnte nicht gestartet werden. Bitte erneut versuchen.";
  }
}

function renderTasks() {
  $("taskList").innerHTML = "";

  tasks.forEach((task, index) => {
    const row = document.createElement("div");
    row.className = "task-row";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.done;
    checkbox.addEventListener("change", () => {
      tasks[index].done = checkbox.checked;
      save("jarvis_tasks_v1", tasks);
      renderTasks();
    });

    const label = document.createElement("span");
    label.textContent = task.text;
    if (task.done) label.className = "done";

    const remove = document.createElement("button");
    remove.className = "icon-btn";
    remove.textContent = "✕";
    remove.addEventListener("click", () => {
      tasks.splice(index, 1);
      save("jarvis_tasks_v1", tasks);
      renderTasks();
    });

    row.append(checkbox, label, remove);
    $("taskList").appendChild(row);
  });

  $("openTasks").textContent = tasks.filter(t => !t.done).length;
  $("doneTasks").textContent = tasks.filter(t => t.done).length;
}

function addTask() {
  const input = $("taskInput");
  const text = input.value.trim();
  if (!text) return;

  tasks.push({ text, done: false });
  save("jarvis_tasks_v1", tasks);
  input.value = "";
  renderTasks();
}

function updateDashboard() {
  const now = new Date();
  $("clock").textContent = now.toLocaleTimeString("de-DE");
  $("date").textContent = now.toLocaleDateString("de-DE");
  $("internet").textContent = navigator.onLine ? "Verbunden" : "Offline";
}

if (navigator.getBattery) {
  navigator.getBattery().then(battery => {
    const updateBattery = () => {
      $("battery").textContent =
        Math.round(battery.level * 100) + "%";
    };
    updateBattery();
    battery.addEventListener("levelchange", updateBattery);
  }).catch(() => {
    $("battery").textContent = "Nicht verfügbar";
  });
} else {
  $("battery").textContent = "Nicht verfügbar";
}

$("settingsButton").addEventListener("click", () => {
  $("settings").classList.toggle("open");
});

$("sendButton").addEventListener("click", sendMessage);
$("messageInput").addEventListener("keydown", event => {
  if (event.key === "Enter") sendMessage();
});

$("micButton").addEventListener("click", startListening);
$("stopButton").addEventListener("click", stopSpeaking);
$("addTask").addEventListener("click", addTask);
$("taskInput").addEventListener("keydown", event => {
  if (event.key === "Enter") addTask();
});

$("voiceToggle").addEventListener("change", saveSettings);
$("voiceSelect").addEventListener("change", saveSettings);
$("speed").addEventListener("input", () => {
  $("speedValue").textContent = Number($("speed").value).toFixed(2);
  saveSettings();
});
$("answerStyle").addEventListener("change", saveSettings);
$("theme").addEventListener("change", saveSettings);

$("clearMemory").addEventListener("click", () => {
  if (!confirm("Möchtest du den Chatverlauf wirklich löschen?")) return;
  history = [];
  save("jarvis_conversation_v1", history);
  $("chat").innerHTML = "";
  updateMemoryCount();
  addMessage("jarvis", "Chatverlauf gelöscht. Ich bin bereit.");
});

window.addEventListener("online", updateDashboard);
window.addEventListener("offline", updateDashboard);

updateSettingsUI();
updateDashboard();
renderTasks();
updateMemoryCount();

history.forEach(item => {
  if (item.role === "user") {
    addMessage("user", item.content);
  } else if (item.role === "assistant") {
    addMessage("jarvis", item.content);
  }
});

if (!history.length) {
  addMessage("jarvis", "System online. Guten Tag. Wie kann ich helfen?");
}
setInterval(updateDashboard, 1000);
</script>
</body>
</html>
