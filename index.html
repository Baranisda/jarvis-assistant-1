
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS | Baran</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#030b18;color:#d9f4ff;
 font-family:Arial,sans-serif;min-height:100vh;
 display:flex;flex-direction:column;align-items:center;
}
header{text-align:center;padding:25px}
h1{letter-spacing:7px;color:#65d9ff}
#status{color:#70a9c5;font-size:13px}
.reactor{
 width:190px;height:190px;border-radius:50%;
 border:3px solid #45cfff;
 box-shadow:0 0 25px #008cff, inset 0 0 30px #008cff;
 display:grid;place-items:center;margin:25px auto;
 animation:pulse 3s infinite;
}
.core{
 width:95px;height:95px;border-radius:50%;
 background:#b9f4ff;box-shadow:0 0 45px #16bfff;
}
@keyframes pulse{50%{box-shadow:0 0 55px #008cff,inset 0 0 45px #008cff}}
main{width:min(92%,500px)}
#chat{
 height:260px;overflow:auto;background:#09182b;
 border:1px solid #16476a;border-radius:15px;
 padding:15px;margin-bottom:12px;
}
.msg{padding:10px;margin:8px 0;border-radius:10px;background:#102b45}
.user{background:#124d70;text-align:right}
.controls{display:flex;gap:8px}
input{
 flex:1;min-width:0;background:#0b1c30;color:white;
 border:1px solid #24638a;border-radius:10px;padding:13px;
}
button{
 background:#087eae;color:white;border:0;
 border-radius:10px;padding:13px;font-weight:bold;
}
#mic{margin-top:10px;width:100%;background:#125071}
footer{padding:20px;color:#537b96;font-size:12px}
</style>
</head>
<body>
<header>
<h1>J.A.R.V.I.S.</h1>
<div id="status">SYSTEM ONLINE · BARAN EDITION</div>
</header>

<div class="reactor"><div class="core"></div></div>

<main>
<div id="chat">
<div class="msg">Guten Tag, Baran. Ich bin JARVIS. Wie kann ich Ihnen helfen?</div>
</div>
<div class="controls">
<input id="message" placeholder="Nachricht an JARVIS...">
<button onclick="send()">Senden</button>
</div>
<button id="mic" onclick="listen()">🎙️ Sprechen</button>
</main>
<footer>JARVIS v0.1 · Persönlicher Assistent</footer>

<script>
const chat=document.getElementById("chat");
function say(text){
 if(!("speechSynthesis" in window))return;
 let voice=new SpeechSynthesisUtterance(text);
 voice.lang="de-DE";
 voice.rate=0.9;
 voice.pitch=0.75;
 speechSynthesis.speak(voice);
}
function add(text,cls){
 let div=document.createElement("div");
 div.className="msg "+cls;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}
function send(){
 let input=document.getElementById("message");
 let text=input.value.trim();
 if(!text)return;
 add(text,"user");
 input.value="";
 let answer="Ich bin bereit, Baran. Mein KI-Gehirn wird gerade vorbereitet.";
 setTimeout(()=>{add(answer,"");say(answer)},400);
}
function listen(){
 const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Speech){alert("Spracherkennung wird in diesem Browser nicht unterstützt.");return;}
 let recognition=new Speech();
 recognition.lang="de-DE";
 recognition.onresult=e=>{
 document.getElementById("message").value=e.results[0][0].transcript;
 send();
 };
 recognition.onerror=()=>alert("Spracherkennung nicht verfügbar.");
 recognition.start();
}
document.getElementById("message").addEventListener("keydown",e=>{
 if(e.key==="Enter")send();
});
</script>
</body>
</html>
