
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #050505;
  color: #f5c542;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

header {
  width: 100%;
  padding: 22px;
  text-align: center;
  border-bottom: 1px solid #70551c;
  letter-spacing: 5px;
  font-size: 24px;
}

.reactor {
  width: 130px;
  height: 130px;
  margin: 30px auto 15px;
  border: 5px solid #d5a82f;
  border-radius: 50%;
  box-shadow: 0 0 25px #c99520, inset 0 0 20px #c99520;
  display: grid;
  place-items: center;
  font-size: 52px;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { box-shadow: 0 0 10px #c99520; }
  to { box-shadow: 0 0 35px #ffcf40; }
}

#status {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 18px;
}

#chat {
  width: 92%;
  max-width: 600px;
  height: 42vh;
  overflow-y: auto;
  border: 1px solid #70551c;
  border-radius: 12px;
  padding: 15px;
  background: #101010;
}

.message {
  margin: 12px 0;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.user { color: white; }
.jarvis { color: #f5c542; }
.error { color: #ff7777; }

.controls {
  width: 92%;
  max-width: 600px;
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border-radius: 8px;
  border: 1px solid #a77c20;
  background: #151515;
  color: white;
  font-size: 16px;
}

button {
  background: #d6a52c;
  color: black;
  border: none;
  border-radius: 8px;
  padding: 12px 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled { opacity: .5; }

.options {
  display: flex;
  gap: 10px;
  margin: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

footer {
  color: #777;
  font-size: 11px;
  padding: 20px;
}
</style>
</head>

<body>

<header>J.A.R.V.I.S.</header>

<div class="reactor">J</div>
<div id="status">SYSTEM ONLINE</div>

<div id="chat"></div>

<div class="controls">
  <input id="message" placeholder="Nachricht an JARVIS...">
  <button id="send" onclick="sendMessage()">SENDEN</button>
</div>

<div class="options">
  <button onclick="startMic()">🎙️ Mikrofon</button>
  <button onclick="toggleVoice()" id="voiceBtn">🔊 Stimme AN</button>
  <button onclick="clearMemory()">🗑️ Verlauf löschen</button>
</div>

<footer>JARVIS PERSONAL AI SYSTEM · MEMORY ACTIVE</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const statusText = document.getElementById("status");
const sendButton = document.getElementById("send");

const STORAGE_KEY = "jarvis_conversation_v1";

let voiceEnabled = true;
let history = [];

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

  if (Array.isArray(saved)) {
    history = saved
      .filter(item =>
        item &&
        ["user", "model"].includes(item.role) &&
        typeof item.text === "string"
      )
      .slice(-12);
  }
} catch {
  history = [];
}

function saveMemory() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(history.slice(-12))
    );
  } catch {
    statusText.textContent = "SPEICHER NICHT VERFÜGBAR";
  }
}

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function displayHistory() {
  chat.innerHTML = "";

  addMessage(
    "JARVIS: Guten Tag. Ich bin bereit. Ich kann mich an deinen gespeicherten Gesprächsverlauf erinnern.",
    "jarvis"
  );

  for (const item of history) {
    addMessage(
      (item.role === "user" ? "DU: " : "JARVIS: ") + item.text,
      item.role === "user" ? "user" : "jarvis"
    );
  }
}

function speak(text) {
  if (!voiceEnabled || !("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "de-DE";
  speech.rate = 0.95;
  speech.pitch = 0.85;

  window.speechSynthesis.speak(speech);
}

function toggleVoice() {
  voiceEnabled = !voiceEnabled;

  document.getElementById("voiceBtn").textContent =
    voiceEnabled ? "🔊 Stimme AN" : "🔇 Stimme AUS";

  if (!voiceEnabled) {
    window.speechSynthesis.cancel();
  }
}

async function sendMessage() {
  const message = input.value.trim();

  if (!message || sendButton.disabled) return;

  addMessage("DU: " + message, "user");
  input.value = "";

  const previousHistory = history.slice(-12);

  sendButton.disabled = true;
  statusText.textContent = "JARVIS DENKT...";

  const waiting = addMessage("JARVIS: Einen Moment...", "jarvis");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message,
        history: previousHistory
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "HTTP-Fehler " + response.status);
    }

    if (!data.reply) {
      throw new Error("Keine Antwort erhalten.");
    }

    waiting.textContent = "JARVIS: " + data.reply;

    history = [
      ...previousHistory,
      { role: "user", text: message },
      { role: "model", text: data.reply }
    ].slice(-12);

    saveMemory();
    speak(data.reply);

    statusText.textContent = "SYSTEM ONLINE · MEMORY ACTIVE";

  } catch (error) {
    waiting.className = "message error";
    waiting.textContent = "JARVIS-FEHLER: " + error.message;
    statusText.textContent = "VERBINDUNGSFEHLER";
  } finally {
    sendButton.disabled = false;
  }
}

function clearMemory() {
  if (!confirm("Möchtest du deinen gespeicherten Gesprächsverlauf löschen?")) {
    return;
  }

  history = [];
  localStorage.removeItem(STORAGE_KEY);
  displayHistory();

  statusText.textContent = "GEDÄCHTNIS GELÖSCHT";
}

input.addEventListener("keydown", event => {
  if (event.key === "Enter") sendMessage();
});

function startMic() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    addMessage("JARVIS: Spracheingabe wird nicht unterstützt.", "error");
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "de-DE";
  recognition.interimResults = false;

  statusText.textContent = "ICH HÖRE ZU...";

  recognition.onresult = event => {
    input.value = event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = event => {
    statusText.textContent = "MIKROFONFEHLER: " + event.error;
  };

  recognition.onend = () => {
    if (statusText.textContent === "ICH HÖRE ZU...") {
      statusText.textContent = "SYSTEM ONLINE";
    }
  };

  recognition.start();
}

displayHistory();
statusText.textContent = "SYSTEM ONLINE · MEMORY ACTIVE";
</script>

</body>
</html>
